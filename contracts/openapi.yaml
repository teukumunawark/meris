openapi: 3.0.3
info:
  title: Meris API
  version: 1.0.0
paths:
  /session:
    post:
      summary: Create a new split bill session by uploading a receipt
      operationId: CreateSession
      parameters:
        - name: Accept-Language
          in: header
          description: Preferred language for error messages (e.g., 'id', 'en')
          schema:
            type: string
            default: en
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                receipt:
                  type: string
                  format: binary
                payerName:
                  type: string
                payerBankName:
                  type: string
                payerBankAccount:
                  type: string
              required:
                - receipt
      responses:
        '200':
          description: Session created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionCreationResponse'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /session/{id}:
    get:
      summary: Get details of a specific session
      operationId: GetSession
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: Accept-Language
          in: header
          description: Preferred language for error messages
          schema:
            type: string
            default: en
      responses:
        '200':
          description: Detailed session data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '404':
          description: Session not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /session/{id}/join:
    post:
      summary: Join a session as a participant
      operationId: JoinSession
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: Accept-Language
          in: header
          description: Preferred language for error messages
          schema:
            type: string
            default: en
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                token:
                  type: string
              required:
                - name
      responses:
        '200':
          description: Joined successfully (already exists with matching token)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParticipantResponse'
        '201':
          description: Joined successfully as a new participant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParticipantResponse'
        '409':
          description: Name already taken in this session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Session not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /session/{id}/claim:
    post:
      summary: Claim or adjust share of a specific item
      operationId: ClaimItem
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: Accept-Language
          in: header
          description: Preferred language for error messages
          schema:
            type: string
            default: en
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                participantId:
                  type: integer
                itemId:
                  type: string
                shares:
                  type: number
                token:
                  type: string
              required:
                - participantId
                - itemId
                - shares
                - token
      responses:
        '200':
          description: Claim registered
        '400':
          description: Invalid claim (e.g. quantity exceeded)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized (invalid token)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Item or Participant not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /session/{id}/item:
    post:
      summary: Add a new item to the session
      operationId: AddItem
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                price:
                  type: number
                quantity:
                  type: integer
                token:
                  type: string
              required:
                - name
                - price
                - quantity
                - token
      responses:
        '201':
          description: Item added
  /session/{id}/item/{itemId}:
    put:
      summary: Update an existing item (price, quantity, name)
      operationId: UpdateItem
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: itemId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                price:
                  type: number
                quantity:
                  type: integer
                token:
                  type: string
              required:
                - name
                - price
                - quantity
                - token
      responses:
        '200':
          description: Item updated
    delete:
      summary: Delete an item from the session
      operationId: DeleteItem
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: itemId
          in: path
          required: true
          schema:
            type: string
        - name: token
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Item deleted
  /session/{id}/item/{itemId}/rename:
    put:
      summary: Rename a specific item in the session
      operationId: RenameItem
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: itemId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
              required:
                - name
      responses:
        '200':
          description: Item renamed
  /session/{id}/participant/{participantId}:
    delete:
      summary: Delete a participant from a session
      operationId: DeleteParticipant
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: participantId
          in: path
          required: true
          schema:
            type: string
        - name: token
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Participant deleted
  /session/{id}/payment-info:
    put:
      summary: Update payment information for a session
      operationId: UpdatePaymentInfo
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                payerBankName:
                  type: string
                payerBankAccount:
                  type: string
                token:
                  type: string
              required:
                - payerBankName
                - payerBankAccount
                - token
      responses:
        '200':
          description: Payment information updated
  /session/{id}/bill:
    post:
      summary: Add a new bill to the session
      operationId: AddBill
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                payerName:
                  type: string
                name:
                  type: string
                tax:
                  type: number
                serviceCharge:
                  type: number
                grandTotal:
                  type: number
                token:
                  type: string
              required:
                - payerName
                - name
                - tax
                - serviceCharge
                - grandTotal
                - token
      responses:
        '201':
          description: Bill added
  /session/{id}/bill/{billId}:
    put:
      summary: Update an existing bill
      operationId: UpdateBill
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: billId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                payerName:
                  type: string
                name:
                  type: string
                tax:
                  type: number
                serviceCharge:
                  type: number
                grandTotal:
                  type: number
                token:
                  type: string
              required:
                - payerName
                - name
                - tax
                - serviceCharge
                - grandTotal
                - token
      responses:
        '200':
          description: Bill updated
    delete:
      summary: Delete a bill from the session
      operationId: DeleteBill
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: billId
          in: path
          required: true
          schema:
            type: string
        - name: token
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Bill deleted
  /session/{id}/participant/{participantId}/bank:
    put:
      summary: Update bank details for a participant
      operationId: UpdateParticipantBankInfo
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: participantId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                bankName:
                  type: string
                bankAccount:
                  type: string
                token:
                  type: string
              required:
                - bankName
                - bankAccount
                - token
      responses:
        '200':
          description: Bank info updated
  /session/{id}/participant/{participantId}/name:
    put:
      summary: Rename a participant, keeping their claims and token
      operationId: RenameParticipant
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: participantId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                token:
                  type: string
              required:
                - name
                - token
      responses:
        '200':
          description: Participant renamed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParticipantResponse'
        '400':
          description: Invalid participant ID, empty name, or missing token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Token does not match the participant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Name already taken in this session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  schemas:
    SessionCreationResponse:
      type: object
      properties:
        id:
          type: string
        payerName:
          type: string
        payerBankName:
          type: string
        payerBankAccount:
          type: string
        tax:
          type: number
        serviceCharge:
          type: number
        grandTotal:
          type: number
        createdAt:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/Item'
        participants:
          type: array
          items:
            $ref: '#/components/schemas/Participant'
        payerId:
          type: integer
        payerToken:
          type: string
        bills:
          type: array
          items:
            $ref: '#/components/schemas/Bill'
        transfers:
          type: array
          items:
            $ref: '#/components/schemas/Transfer'
    Session:
      type: object
      properties:
        id:
          type: string
        payerName:
          type: string
        payerBankName:
          type: string
        payerBankAccount:
          type: string
        tax:
          type: number
        serviceCharge:
          type: number
        grandTotal:
          type: number
        createdAt:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/Item'
        participants:
          type: array
          items:
            $ref: '#/components/schemas/Participant'
        bills:
          type: array
          items:
            $ref: '#/components/schemas/Bill'
        transfers:
          type: array
          items:
            $ref: '#/components/schemas/Transfer'
    Item:
      type: object
      properties:
        id:
          type: string
        sessionId:
          type: string
        billId:
          type: string
        name:
          type: string
        price:
          type: number
        quantity:
          type: integer
        claims:
          type: array
          items:
            $ref: '#/components/schemas/Claim'
    Participant:
      type: object
      properties:
        id:
          type: integer
        sessionId:
          type: string
        name:
          type: string
        bankName:
          type: string
        bankAccount:
          type: string
        totalOwed:
          type: number
        subtotal:
          type: number
        tax:
          type: number
        serviceCharge:
          type: number
        claims:
          type: array
          items:
            $ref: '#/components/schemas/Claim'
    ParticipantResponse:
      type: object
      properties:
        id:
          type: integer
        sessionId:
          type: string
        name:
          type: string
        token:
          type: string
    Claim:
      type: object
      properties:
        id:
          type: integer
        itemId:
          type: string
        participantId:
          type: integer
        name:
          type: string
        shares:
          type: number
    Error:
      type: object
      properties:
        error:
          type: string
          description: Internal error code/translation key (e.g. 'errors.unauthorized')
        message:
          type: string
          description: Localized human-readable error message
      required:
        - error
        - message
    Bill:
      type: object
      properties:
        id:
          type: string
        payerName:
          type: string
        name:
          type: string
        tax:
          type: number
        serviceCharge:
          type: number
        grandTotal:
          type: number
        createdAt:
          type: string
      required:
        - id
        - payerName
        - name
        - tax
        - serviceCharge
        - grandTotal
        - createdAt
    Transfer:
      type: object
      properties:
        from:
          type: string
        to:
          type: string
        amount:
          type: number
      required:
        - from
        - to
        - amount
