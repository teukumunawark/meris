# Homelab app `meris-client`: copy to /srv/apps/meris-client/docker-compose.yml on zoro.
# Convention: compose project name = service name = container_name = OTEL_SERVICE_NAME.
# The client uses no Postgres or Redis. NEXT_PUBLIC_BACKEND_URL is baked into the image at build time (CI build-arg),
# so setting it here would have no effect. Create an empty .env (`touch .env`) so env_file resolves.
name: meris-client

networks:
  shared-net:
    external: true

services:
  meris-client:
    image: ghcr.io/teukumunawark/meris-client:${APP_VERSION:-latest}
    container_name: meris-client
    restart: unless-stopped
    env_file: .env
    environment:
      OTEL_SERVICE_NAME: meris-client
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment.name=homelab,service.version=${APP_VERSION:-dev}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      # Traces only: the client registers no metric reader, so there is no metric export interval to set
      OTEL_TRACES_SAMPLER: parentbased_always_on
      OTEL_LOGS_EXPORTER: none
    networks: [shared-net]
    mem_limit: 384m
    cpus: 0.5
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/healthz >/dev/null || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 20s
