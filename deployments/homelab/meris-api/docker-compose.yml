# Homelab app `meris-api`: copy to /srv/apps/meris-api/docker-compose.yml on zoro.
# Convention: compose project name = service name = container_name = OTEL_SERVICE_NAME = Redis user and prefix.
# Postgres database and role: meris_api (name with - replaced by _).
# .env is generated by `scripts/new-service.sh meris-api` (DATABASE_URL, DATABASE_DIRECT_URL, REDIS_URL, REDIS_KEY_PREFIX).
# Add APP_ENV, ALLOWED_ORIGINS, AI_*, and S3_* (RustFS shared service) from .env.example by hand. Never commit .env.
name: meris-api

networks:
  shared-net:
    external: true

services:
  meris-api:
    image: ghcr.io/teukumunawark/meris-api:${APP_VERSION:-latest}
    container_name: meris-api
    restart: unless-stopped
    env_file: .env
    environment:
      OTEL_SERVICE_NAME: meris-api
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment.name=homelab,service.version=${APP_VERSION:-dev}
      # The API uses the OTLP gRPC trace exporter, which takes host:port (no scheme) and Alloy's gRPC port 4317
      OTEL_EXPORTER_OTLP_ENDPOINT: alloy:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_METRIC_EXPORT_INTERVAL: "30000"
      OTEL_TRACES_SAMPLER: parentbased_always_on
      # Logs go to stdout (JSON), NOT through OTLP: Alloy already collects stdout from every container
      OTEL_LOGS_EXPORTER: none
      BIND_ADDRESS: 0.0.0.0
      PORT: "8080"
    networks: [shared-net]
    mem_limit: 256m
    cpus: 0.4
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    # Only for private access through tailscale serve. Public goes through Caddy, with no ports.
    # ports:
    #   - 127.0.0.1:<port>:8080
