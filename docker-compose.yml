services:
  postgres:
    container_name: meris-database
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: meris
      POSTGRES_PASSWORD: password
      POSTGRES_DB: merisdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    container_name: meris-redis
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
