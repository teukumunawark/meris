name: meris

networks:
  shared-net:
    external: true

services:
  meris-api:
    image: ghcr.io/teukumunawark/meris-api:${APP_VERSION:-latest}
    container_name: meris-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      OTEL_SERVICE_NAME: meris-api
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment.name=homelab,service.version=${APP_VERSION:-dev}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_METRIC_EXPORT_INTERVAL: "30000"
      OTEL_TRACES_SAMPLER: parentbased_always_on
      OTEL_LOGS_EXPORTER: none
      BIND_ADDRESS: 0.0.0.0
      PORT: 8080
    networks:
      - shared-net
    deploy:
      resources:
        limits:
          cpus: '0.40'
          memory: 256M
        reservations:
          cpus: '0.10'
          memory: 64M
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health >/dev/null || exit 1" ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  meris-client:
    image: ghcr.io/teukumunawark/meris-client:${APP_VERSION:-latest}
    container_name: meris-client
    restart: unless-stopped
    env_file:
      - .env
    environment:
      OTEL_SERVICE_NAME: meris-client
      OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy:4318
      NEXT_PUBLIC_BACKEND_URL: https://meris-api.teukumunawark.my.id
    networks:
      - shared-net
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 384M
        reservations:
          cpus: '0.20'
          memory: 192M
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/healthz >/dev/null || exit 1" ]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 20s
    depends_on:
      - meris-api
